name: dart_verify_mcp
description: >-
  An MCP server that gives coding agents verification checks the official Dart
  MCP server does not: proving new tests can fail, config-driven import layer
  rules, unused dependency detection, and a single done/not-done gate.
version: 0.1.0
repository: https://github.com/Abhinand-VB/dart-verify-mcp

environment:
  sdk: ^3.11.0

executables:
  dart_verify_mcp:
dependencies:
  dart_mcp: ^0.5.2
  glob: ^2.2.0
  path: ^1.9.1
  yaml: ^3.1.4
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
