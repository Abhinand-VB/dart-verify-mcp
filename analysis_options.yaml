include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
    - directives_ordering
    - prefer_single_quotes
    - always_declare_return_types
    - only_throw_errors
